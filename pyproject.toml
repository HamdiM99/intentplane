[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentplane"
version = "0.2.0"
description = "Domain-independent intent control plane for LLM agents (generalisation of AgenticZeroTrust)"
requires-python = ">=3.10"
dependencies = ["cedarpy>=4.0"]   # the bank pack's policies are Cedar; the core itself has no dependency

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["intentplane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
