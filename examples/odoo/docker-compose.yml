# A local Odoo 17 (Community) with PostgreSQL, for the accounts-payable demo. Bound to 127.0.0.1 only.
#   docker compose -f examples/odoo/docker-compose.yml up -d
#   python examples/odoo/setup_odoo.py      # database, demo vendor, bills, users
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
  odoo:
    image: odoo:17.0
    depends_on: [db]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:8069:8069"
    command: ["odoo", "--db-filter=^ap_demo$$"]
    volumes:
      - odoo-data:/var/lib/odoo
volumes:
  odoo-db:
  odoo-data:
